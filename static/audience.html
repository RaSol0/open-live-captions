<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nerdearla Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0B0E13;
    --surface: #151920;
    --surface-2: #1E232C;
    --border: #2A3038;
    --text-primary: #F5F7FA;
    --text-secondary: #8B95A3;
    --accent: #9147FF;
    --live-red: #E91916;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text-primary);
    font-family: 'Inter', system-ui, sans-serif;
  }
  body { display: flex; flex-direction: column; }

  .header {
    height: 64px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .title-group { display: flex; align-items: center; gap: 12px; }
  .wordmark { font-size: 15px; font-weight: 700; }
  .live-badge {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 8px; border-radius: 4px; background: var(--live-red);
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }

  .controls { display: flex; align-items: center; gap: 12px; }
  .viewers { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 13px; }
  .pill {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--surface-2); border-radius: 8px;
    font-size: 14px; font-weight: 700; color: var(--text-primary);
    border: none; cursor: pointer; font-family: inherit;
  }
  .pill .dot-accent { color: var(--accent); font-size: 12px; }
  .pill.dropdown { position: relative; user-select: none; }
  .chevron { font-size: 10px; color: var(--text-secondary); margin-left: 2px; transition: transform 0.15s; }
  .pill.dropdown.open .chevron { transform: rotate(180deg); }
  .dropdown-menu {
    display: none;
    position: absolute; top: calc(100% + 6px); left: 0; min-width: 100%;
    background: var(--surface-2); border-radius: 8px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    z-index: 100;
  }
  .pill.dropdown.open .dropdown-menu { display: block; }
  .dropdown-item {
    padding: 10px 14px; color: #FFFFFF; font-size: 14px; font-weight: 400;
    white-space: nowrap; cursor: pointer;
  }
  .dropdown-item:hover { background: var(--accent); font-weight: 700; }

  .player {
    flex: 1; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    background: var(--surface); overflow: hidden; position: relative;
  }
  .waveform-icon { color: var(--border); font-size: 64px; margin-bottom: 24px; }

  .caption-bar {
    width: 100%; box-sizing: border-box;
    padding: 16px 64px 32px 64px;
    background: rgba(0,0,0,0.8);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    min-height: 90px; justify-content: center;
  }
  .caption-original {
    font-size: 16px; color: var(--text-secondary); text-align: center;
    max-width: 900px;
  }
  .caption-translated {
    font-size: 36px; font-weight: 700; color: #fff; text-align: center;
    line-height: 1.3; max-width: 900px;
  }

  .footer {
    height: 48px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-secondary);
  }
  .a11y-controls { display: flex; align-items: center; gap: 16px; }
  .a11y-controls button {
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 16px; font-family: inherit;
  }
  .a11y-controls button:hover { color: var(--text-primary); }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.connected { background: #34D399; }
  .status-dot.disconnected { background: #F87171; }

  body.large-text .caption-translated { font-size: 52px; }
  body.large-text .caption-original { font-size: 22px; }
  body.high-contrast .caption-bar { background: #000; }
  body.high-contrast .caption-translated { color: #FFFF00; }
</style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <span class="wordmark">Nerdearla Live</span>
      <div class="live-badge"><span class="live-dot"></span>EN VIVO</div>
    </div>
    <div class="controls">
      <div class="viewers"><span class="status-dot disconnected" id="conn-dot"></span><span id="conn-label">conectando...</span></div>
      <div class="pill dropdown" id="session-dropdown">
        <span class="dot-accent">&#9679;</span>
        <span id="session-label">Escenario 1 - Main Stage</span>
        <span class="chevron">&#9662;</span>
        <div class="dropdown-menu">
          <div class="dropdown-item" data-value="demo-en">Escenario 1 - Main Stage</div>
          <div class="dropdown-item" data-value="demo-es">Escenario 2 - Track B</div>
        </div>
      </div>
      <div class="pill dropdown" id="lang-dropdown">
        <span class="dot-accent">CC</span>
        <span id="lang-label">Espanol</span>
        <span class="chevron">&#9662;</span>
        <div class="dropdown-menu">
          <div class="dropdown-item" data-value="es">Espanol</div>
          <div class="dropdown-item" data-value="en">English</div>
        </div>
      </div>
    </div>
  </div>

  <div class="player">
    <div class="waveform-icon">&#9834;</div>
    <div class="caption-bar">
      <div class="caption-original" id="caption-original">Esperando audio...</div>
      <div class="caption-translated" id="caption-translated"></div>
    </div>
  </div>

  <div class="footer">
    <span id="latency-label">Latencia: --</span>
    <div class="a11y-controls">
      <button id="btn-text-size" title="Tamano de texto">A+</button>
      <button id="btn-contrast" title="Alto contraste">&#9680;</button>
    </div>
  </div>

<script>
  const originalEl = document.getElementById('caption-original');
  const translatedEl = document.getElementById('caption-translated');
  const connDot = document.getElementById('conn-dot');
  const connLabel = document.getElementById('conn-label');
  const latencyLabel = document.getElementById('latency-label');

  let ws = null;
  let lastMsgTime = null;
  let currentSession = 'demo-en';
  let currentLang = 'es';

  function setupDropdown(dropdownId, labelId, onSelect) {
    const dropdown = document.getElementById(dropdownId);
    const label = document.getElementById(labelId);
    dropdown.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.pill.dropdown.open').forEach((el) => {
        if (el !== dropdown) el.classList.remove('open');
      });
      dropdown.classList.toggle('open');
    });
    dropdown.querySelectorAll('.dropdown-item').forEach((item) => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        label.textContent = item.textContent;
        dropdown.classList.remove('open');
        onSelect(item.dataset.value);
      });
    });
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.pill.dropdown.open').forEach((el) => el.classList.remove('open'));
  });

  function connect(sessionId, lang) {
    if (ws) { ws.close(); }
    originalEl.textContent = 'Esperando audio...';
    translatedEl.textContent = '';
    connDot.className = 'status-dot disconnected';
    connLabel.textContent = 'conectando...';

    ws = new WebSocket(`ws://${location.host}/ws/${sessionId}/${lang}`);

    ws.onopen = () => {
      connDot.className = 'status-dot connected';
      connLabel.textContent = 'en vivo';
    };
    ws.onclose = () => {
      connDot.className = 'status-dot disconnected';
      connLabel.textContent = 'desconectado';
    };
    ws.onmessage = (event) => {
      const now = performance.now();
      if (lastMsgTime) {
        latencyLabel.textContent = `Ultimo update: ${((now - lastMsgTime) / 1000).toFixed(1)}s atras`;
      }
      lastMsgTime = now;

      const msg = JSON.parse(event.data);
      if (msg.kind === 'original') {
        originalEl.textContent = msg.text;
      } else if (msg.kind === 'translated') {
        translatedEl.textContent = msg.text;
      }
    };
  }

  setupDropdown('session-dropdown', 'session-label', (value) => {
    currentSession = value;
    connect(currentSession, currentLang);
  });
  setupDropdown('lang-dropdown', 'lang-label', (value) => {
    currentLang = value;
    connect(currentSession, currentLang);
  });

  document.getElementById('btn-text-size').addEventListener('click', () => {
    document.body.classList.toggle('large-text');
  });
  document.getElementById('btn-contrast').addEventListener('click', () => {
    document.body.classList.toggle('high-contrast');
  });

  connect(currentSession, currentLang);
</script>
</body>
</html>
